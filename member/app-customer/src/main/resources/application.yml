server:
  port: 30002


# 日志级别
logging:
  level:
    root: INFO
    com.xcz.member: INFO

wx:
  # 小程序码打开版本：develop 开发版 | trial 体验版 | release 正式版
  env-version: develop
  # 是否校验 page 已发布；本地/体验环境建议 false
  check-path: false

spring:
  application:
    name: app-miniApp
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:MINI_APP_MOBI}
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
