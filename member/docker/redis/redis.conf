############################################
# Redis 基础配置
############################################
bind 0.0.0.0
port 6379
protected-mode no

############################################
# 认证与安全
############################################
# 密码由 docker-compose 启动参数 --requirepass ${REDIS_PASSWORD} 注入
# requirepass 请配置在 member/.env 的 REDIS_PASSWORD

############################################
# 持久化配置
############################################
# 开启 AOF（日志持久化）
appendonly yes
# AOF 文件名
appendfilename "appendonly.aof"
# AOF 同步策略：每秒刷盘一次，性能与安全平衡
appendfsync everysec
# RDB 快照配置（可以留作快速恢复）
save 900 1
save 300 10
save 60 10000
# RDB 文件保存位置
dbfilename dump.rdb

############################################
# 文件与目录
############################################
# 数据目录（Docker 中映射到宿主机的目录）
dir /data

# 日志目录（Docker 中映射到宿主机的目录）
#logfile "/log/redis.log"

############################################
# 内存与淘汰策略
############################################
# 最大内存使用（示例：1GB）
# maxmemory 1gb
# 内存满时的淘汰策略（推荐：volatile-lru）
# maxmemory-policy volatile-lru

############################################
# 网络优化
############################################
tcp-keepalive 300
timeout 0

############################################
# 日志级别
############################################
loglevel notice

############################################
# 容器环境优化
############################################
# 关闭后台运行（Docker 已经是前台运行）
daemonize no
