# RocketMQ Broker 配置（Docker 环境）
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
deleteWhen = 04
fileReservedTime = 48
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH

# Docker Desktop 下，宿主机应用通过 host.docker.internal 访问 Broker
brokerIP1 = host.docker.internal

# 自动创建 Topic 和订阅组（开发环境方便调试，生产环境建议关闭）
autoCreateTopicEnable = true
autoCreateSubscriptionGroup = true

# 监听端口（容器内默认）
listenPort = 10911
