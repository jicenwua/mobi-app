server:
  port: 30000

# 日志级别（输出见 logback-spring.xml：控制台着色 + ./log/{应用名}/ 按天归档，保留 3 天）
logging:
  level:
    root: INFO
    com.xcz.member: INFO

spring:
  application:
    name: app-gateway
  config:
    import:
      - optional:file:../.env[.properties]
      - optional:nacos:${spring.application.name}.yaml
  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}
      config:
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:MINI_APP_MOBI}
        file-extension: yaml
        username: ${NACOS_USERNAME:nacos}
        password: ${NACOS_PASSWORD}

